services:
  backend:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    image: ghcr.io/astral-sh/uv:python3.14-bookworm
    stop_grace_period: 30s
    restart: unless-stopped
    user: 1000:1000
    group_add:
      # Host docker group gid (override DOCKER_GID on hosts where it differs).
      - "${DOCKER_GID:-959}"
    ports:
      - "${BACKEND_PORT:-8001}:8000"
      - "${BACKEND_DEBUG_PORT:-8090}:5678"
    volumes:
      - ./:/app
      # Expose the host Docker socket so testcontainers-backed tests
      # (tests that run without TEST_DATABASE_URL) can spin up throwaway Postgres.
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: sh -c "uv sync && uv run uvicorn src.main:app --reload --host 0.0.0.0 --port 8000 --timeout-graceful-shutdown 30"
    depends_on:
      - postgres
      - redis
      - mailcrab
    env_file:
      - ./src/.env
    environment:
      PYDEVD_DISABLE_FILE_VALIDATION: true
      UV_CACHE_DIR: /app/.cache/uv
      UV_PROJECT_ENVIRONMENT: /app/.cache/container_venv
      PATH: "/app/.cache/container_venv/bin:$PATH"
      HOME: /app

  worker:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm
    stop_grace_period: 60s
    restart: unless-stopped
    user: 1000:1000
    ports:
      - "${WORKER_DEBUG_PORT:-8091}:5678"
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "uv sync && uv run -m watchfiles \"huey_consumer src.worker.huey -w 2 --worker-type thread --periodic\" src/"
    depends_on:
      - postgres
      - redis
      - mailcrab
    env_file:
      - ./src/.env
    environment:
      PYDEVD_DISABLE_FILE_VALIDATION: true
      UV_CACHE_DIR: /app/.cache/uv
      UV_PROJECT_ENVIRONMENT: /app/.cache/container_venv
      PATH: "/app/.cache/container_venv/bin:$PATH"
      HOME: /app
      HUEY_DASHBOARD_WORKER: 1
      PYTHONPATH: /app

  frontend:
    image: node:latest
    restart: unless-stopped
    depends_on:
      - backend
      - worker
    user: 1000:1000
    ports:
      - "${FRONTEND_PORT:-8002}:8100"
    volumes:
      - ./frontend:/app
    working_dir: /app
    environment:
      VITE_INTERNAL_API_URL: http://backend:8000
    command: bash -c "npm install && npm run dev"

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: retail-portfolio
      POSTGRES_USER: retail-portfolio-user
      POSTGRES_PASSWORD: password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mailcrab:
    image: marlonb/mailcrab:latest
    restart: unless-stopped
    ports:
      - "${MAILCRAB_PORT:-8003}:1080"

volumes:
  postgres_data:
