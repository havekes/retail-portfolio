name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Type check
        run: |
          uv run ty check

      - name: Lint
        run: uv run ruff check && uv run ruff format --check

      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Prepare env file
        run: cp frontend/.env.example frontend/.env

      - name: Run type checks
        run: |
          cd frontend
          npm run check

      - name: Run ESLint and Prettier checks
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest
        run: |
          cd frontend
          npm run test:run

  indicator-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: services/indicator-service/go.sum

      - name: Install dependencies
        run: |
          cd services/indicator-service
          go mod download

      - name: Vet
        run: |
          cd services/indicator-service
          go vet ./...

      - name: Build
        run: |
          cd services/indicator-service
          go build ./...

      - name: Test
        run: |
          cd services/indicator-service
          go test ./...
