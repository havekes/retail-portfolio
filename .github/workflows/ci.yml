name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Type check
        run: |
          uv run ty check

      - name: Lint
        run: uv run ruff check && uv run ruff format --check

      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://localhost:8001
      VITE_INTERNAL_API_URL: http://localhost:8001
      VITE_ALLOWED_HOSTS: localhost
      JWT_SECRET: test-secret-key-12345678901234567890

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Run type checks
        run: |
          cd frontend
          npm run check

      - name: Run ESLint and Prettier checks
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest
        run: |
          cd frontend
          npm run test:run

  indicator-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: services/indicator-service/go.sum

      - name: Install dependencies
        run: |
          cd services/indicator-service
          go mod download

      - name: Vet
        run: |
          cd services/indicator-service
          go vet ./...

      - name: Format
        run: |
          cd services/indicator-service
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
          fi
          test -z "$(gofmt -l .)"

      - name: Staticcheck
        run: |
          cd services/indicator-service
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Vulnerability scan
        run: |
          cd services/indicator-service
          out=$(go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... 2>&1) || code=$?
          echo "$out"
          if [ "${code:-0}" -ne 0 ]; then
            # Under Go 1.27.1 (pinned for staticcheck compatibility), net/http has known CVE GO-2026-4982.
            # Fixed in Go 1.27.2. If this is the only vulnerability, allow it per PR description.
            if [ "$code" -eq 3 ] && echo "$out" | grep -q "GO-2026-4982" && echo "$out" | grep -q "Your code is affected by 1 vulnerability."; then
              echo "Known unfixable stdlib CVE GO-2026-4982 detected under Go 1.27.1; allowed."
            else
              exit "$code"
            fi
          fi

      - name: Build
        run: |
          cd services/indicator-service
          go build ./...

      - name: Test
        run: |
          cd services/indicator-service
          go test ./...

  mcp-gateway:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: services/mcp-gateway/go.sum

      - name: Install dependencies
        run: |
          cd services/mcp-gateway
          go mod download

      - name: Vet
        run: |
          cd services/mcp-gateway
          go vet ./...

      - name: Format
        run: |
          cd services/mcp-gateway
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
          fi
          test -z "$(gofmt -l .)"

      - name: Staticcheck
        run: |
          cd services/mcp-gateway
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Vulnerability scan
        run: |
          cd services/mcp-gateway
          out=$(go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./... 2>&1) || code=$?
          echo "$out"
          if [ "${code:-0}" -ne 0 ]; then
            # Under Go 1.27.1 (pinned for staticcheck compatibility), net/http has known CVE GO-2026-4982.
            # Fixed in Go 1.27.2. If this is the only vulnerability, allow it per PR description.
            if [ "$code" -eq 3 ] && echo "$out" | grep -q "GO-2026-4982" && echo "$out" | grep -q "Your code is affected by 1 vulnerability."; then
              echo "Known unfixable stdlib CVE GO-2026-4982 detected under Go 1.27.1; allowed."
            else
              exit "$code"
            fi
          fi

      - name: Build
        run: |
          cd services/mcp-gateway
          go build ./...

      - name: Test
        run: |
          cd services/mcp-gateway
          go test ./...
