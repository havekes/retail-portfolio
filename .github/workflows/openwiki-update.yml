name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Run OpenWiki
        # OpenCode Go requires an x-opencode-session header on every request.
        # OpenWiki's openai-compatible provider cannot send custom headers, so the
        # preload shim wraps global fetch (which the provider delegates to) to add it.
        run: openwiki code --update --print
        env:
          NODE_OPTIONS: --import ./scripts/opencode-go-session-fetch.mjs
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: https://opencode.ai/zen/go/v1
          OPENWIKI_MODEL_ID: deepseek-v4.1-flash

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: openwiki
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
