services:
  backend:
    build: .
    container_name: retail-portfolio-backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    stop_grace_period: 30s
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    container_name: retail-portfolio-worker
    stop_grace_period: 60s
    restart: always
    command: huey_consumer src.worker.huey -w 2 --worker-type thread
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    container_name: retail-portfolio-frontend
    restart: always
    ports:
      - "80:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:18
    container_name: retail-portfolio-postgres
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker

  redis:
    image: redis:7-alpine
    container_name: retail-portfolio-redis
    restart: always

  indicator-service:
    build: ./services/indicator-service
    container_name: retail-portfolio-indicator-service
    restart: always
    ports:
      - "8085:8080"
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-prod}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  mcp-gateway:
    build: ./services/mcp-gateway
    container_name: retail-portfolio-mcp-gateway
    restart: always
    # Internal network only by design; no host port is published.
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-prod}"
      BACKEND_BASE_URL: "http://backend:8000"
      MARKET_DATA_SERVICE_TOKEN: "${MARKET_DATA_SERVICE_TOKEN:?MARKET_DATA_SERVICE_TOKEN must be set}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
